version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: edusim-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: edusim

  api:
    build: .
    container_name: edusim-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/edusim
    # Use the same .env for other vars (GEMINI_API_KEY, pricing, etc.)

volumes:
  mongo-data:
